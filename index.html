<body>
<main>
  <div class="topline"><div class="title-wrap"><h1 id="database-title">Карточки</h1><p class="sub" id="database-description"></p></div><button class="settings" id="settings" type="button" aria-label="Включить режим редактирования" title="Режим редактирования">⚙</button></div>
  <div class="edit-panel" id="edit-panel"><p><b>Режим редактирования включён.</b> Изменения сохраняются локально в этом браузере и не отправляются в удалённую базу.</p><div class="edit-tools"><button class="btn" id="edit-base" type="button">Изменить название базы</button><button class="btn" id="add-section" type="button">Добавить раздел</button><button class="btn danger" id="clear-draft" type="button">Отменить локальные изменения</button></div></div>
  <div class="bar"><button class="btn" id="all" type="button">Показать все</button><button class="btn" id="shuffle" type="button">Перемешать</button><button class="btn" id="favorites-filter" type="button" aria-pressed="false" title="Показать только избранные карточки">★ Избранное</button><button class="btn" id="reset" type="button">Сбросить отметки</button><span class="count" id="count"></span></div>
  <div class="legend" id="legend"><span><i class="dot def"></i>определение</span><span><i class="dot thm"></i>теорема / доказательство</span><span><i class="dot ax"></i>аксиома</span></div><div id="root" aria-live="polite"></div>
</main>
<dialog id="editor"><form id="editor-form"><div class="modal-head"><h3 id="editor-title">Редактирование</h3><button class="icon-close" type="button" data-close="editor" aria-label="Закрыть">×</button></div><div class="modal-body" id="editor-fields"></div><div class="modal-actions"><button class="btn" type="submit">Сохранить</button><button class="btn danger hidden" id="delete-item" type="button">Удалить</button><button class="btn" type="button" data-close="editor">Отмена</button></div></form></dialog>
<dialog class="lightbox" id="lightbox"><button type="button" data-close="lightbox" aria-label="Закрыть">×</button><img id="lightbox-image" alt=""></dialog>
<script>
/* Конфигурация источника. По умолчанию данные загружаются из mathAnal.json.
   Для другой базы задайте window.CARDS_DATABASE до загрузки файла или откройте:
   visual.html?data=https://example.org/cards.json */
window.CARDS_CONFIG = window.CARDS_CONFIG || { source: "mathAnal.json", supabase: null };


(function(){
  "use strict";
  var root=document.getElementById("root"), titleEl=document.getElementById("database-title"), descEl=document.getElementById("database-description"), settings=document.getElementById("settings"), editor=document.getElementById("editor"), fields=document.getElementById("editor-fields"), editorTitle=document.getElementById("editor-title"), deleteButton=document.getElementById("delete-item");
  var database=null, originalDatabase=null, done={}, favorites={}, favoritesOnly=false, allOpen=false, editing=false, editTarget=null, shuffled=false;
  function uid(prefix){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
  function clone(x){return JSON.parse(JSON.stringify(x))}
  function cleanText(x){return x==null?"":String(x)}
  function cardId(card){return card.id||card.slug||card.title}
  function storageKey(kind){return "universal-cards-"+kind+"-"+(database&&database.id||"default")}
  function loadDone(){var key=storageKey("progress");if(database&&database.id==="mathAnal"&&!localStorage.getItem(key))key="universal-cards-progress-mathan-colloquium";try{done=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){done={}}}
  function saveDone(){try{localStorage.setItem(storageKey("progress"),JSON.stringify(done))}catch(e){}}
  function loadFavorites(){var key=storageKey("favorites");try{favorites=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){favorites={}}}
  function saveFavorites(){try{localStorage.setItem(storageKey("favorites"),JSON.stringify(favorites))}catch(e){}}
  function normalizeImage(image){if(typeof image==="string")return {url:image,alt:"",caption:""};return {url:cleanText(image.url||image.src),alt:cleanText(image.alt),caption:cleanText(image.caption)}}
  function normalizeCard(card,index){var type=cleanText(card.type||card.kind||"other").toLowerCase();if(type==="definition")type="def";if(type==="theorem")type="thm";if(type==="axiom")type="ax";return {id:cleanText(card.id||card.slug||uid("card")),title:cleanText(card.title||card.t||"Без названия"),type:type,content:cleanText(card.content||card.body||card.b),note:cleanText(card.note||card.idea||card.i),images:(card.images||card.image?[].concat(card.images||card.image):[]).filter(Boolean).map(normalizeImage),sort_order:card.sort_order==null?index:card.sort_order}}
  function normalize(raw){
    if(Array.isArray(raw))raw={sections:raw}; raw=raw||{};
    var sections=raw.sections||raw.groups||raw.data||[];
    if(!Array.isArray(sections))sections=[];
    return {id:cleanText(raw.id||raw.slug||raw.key||"local-base"),title:cleanText(raw.title||raw.name||"Карточки"),description:cleanText(raw.description||raw.subtitle||""),sections:sections.map(function(s,si){var cards=s.cards||s.c||[];return {id:cleanText(s.id||s.slug||uid("section")),title:cleanText(s.title||s.name||s.s||"Раздел "+(si+1)),sort_order:s.sort_order==null?si:s.sort_order,cards:cards.map(normalizeCard)}})}
  }
  function localDraftKey(id){return "universal-cards-draft-"+id}
  function loadDraft(base){try{var draft=JSON.parse(localStorage.getItem(localDraftKey(base.id))||"null");return draft?normalize(draft):base}catch(e){return base}}
  function saveDraft(){try{localStorage.setItem(localDraftKey(database.id),JSON.stringify(database))}catch(e){}}
  function fetchJson(url,headers){return fetch(url,{headers:Object.assign({Accept:"application/json"},headers||{})}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
  function configuredSource(){var p=new URLSearchParams(location.search), url=p.get("data");if(url)return fetchJson(url);if(window.CARDS_DATABASE)return Promise.resolve(window.CARDS_DATABASE);var c=window.CARDS_CONFIG||{};if(c.source)return typeof c.source==="string"?fetchJson(c.source):Promise.resolve(c.source);if(c.supabase&&c.supabase.url&&c.supabase.anonKey){var u=c.supabase.url.replace(/\/$/,"")+"/rest/v1/"+(c.supabase.view||"card_databases")+"?select=*";return fetchJson(u,{apikey:c.supabase.anonKey,Authorization:"Bearer "+c.supabase.anonKey})}throw new Error("Не задан источник базы карточек")}
  function typeLabel(type){return type==="def"?"Определение":type==="thm"?"Теорема":type==="ax"?"Аксиома":type||"Карточка"}
  function el(name,props){var node=document.createElement(name);props=props||{};Object.keys(props).forEach(function(k){if(k==="text")node.textContent=props[k];else if(k==="class")node.className=props[k];else if(k.indexOf("on")===0)node.addEventListener(k.slice(2),props[k]);else node.setAttribute(k,props[k])});return node}
  function count(){var total=database.sections.reduce(function(n,s){return n+s.cards.length},0), learned=Object.keys(done).filter(function(id){return done[id]}).length, fav=Object.keys(favorites).filter(function(id){return favorites[id]}).length;document.getElementById("count").textContent="Выучено: "+learned+" из "+total+" · В избранном: "+fav}
  function showImage(img){document.getElementById("lightbox-image").src=img.url;document.getElementById("lightbox-image").alt=img.alt||"";document.getElementById("lightbox").showModal()}
  function build(){
    root.innerHTML="";document.body.classList.toggle("editing",editing);titleEl.textContent=database.title;descEl.textContent=database.description;descEl.classList.toggle("hidden",!database.description);document.title=database.title;settings.classList.toggle("active",editing);settings.setAttribute("aria-label",editing?"Выключить режим редактирования":"Включить режим редактирования");var favBtn=document.getElementById("favorites-filter");favBtn.classList.toggle("active",favoritesOnly);favBtn.setAttribute("aria-pressed",favoritesOnly?"true":"false");
    var sections=database.sections.slice().sort(function(a,b){return a.sort_order-b.sort_order});if(shuffled){var flat=[];sections.forEach(function(s){s.cards.forEach(function(c){flat.push(c)})});shuffle(flat);sections=[{id:"shuffle",title:"Вразброс",cards:flat}]}

  function renderCard(card,section,index){var id=cardId(card), box=el("article",{class:"card "+card.type+(done[id]?" done":"")+(favorites[id]?" fav":"")+(allOpen?" open":"")}), head=el("button",{class:"head",type:"button","aria-expanded":allOpen?"true":"false"}), left=el("span",{class:"headleft"});box.style.setProperty("--delay",Math.min((index||0)*35,210)+"ms");left.appendChild(el("span",{class:"tag "+card.type,text:typeLabel(card.type)}));left.appendChild(el("span",{class:"term",text:card.title}));head.appendChild(left);var star=el("button",{class:"star"+(favorites[id]?" on":""),type:"button","aria-pressed":favorites[id]?"true":"false","aria-label":favorites[id]?"Убрать из избранного":"Добавить в избранное",title:favorites[id]?"Убрать из избранного":"Добавить в избранное",text:favorites[id]?"★":"☆",onclick:function(e){e.stopPropagation();favorites[id]=!favorites[id];if(!favorites[id])delete favorites[id];saveFavorites();box.classList.toggle("fav",!!favorites[id]);this.classList.toggle("on",!!favorites[id]);var label=favorites[id]?"Убрать из избранного":"Добавить в избранное";this.textContent=favorites[id]?"★":"☆";this.setAttribute("aria-pressed",favorites[id]?"true":"false");this.setAttribute("aria-label",label);this.title=label;this.classList.remove("pop");void this.offsetWidth;this.classList.add("pop");count();if(favoritesOnly&&!favorites[id])build()}});head.appendChild(el("span",{class:"hint",text:"нажми, чтобы открыть"}));var body=el("div",{class:"body"}), inner=el("div",{class:"body-inner"});if(card.content)inner.appendChild(el("p",{text:card.content}));if(card.images&&card.images.length){var imgs=el("div",{class:"image-list"});card.images.forEach(function(image){if(!image.url)return;var fig=el("figure",{class:"card-figure"}), picture=el("img",{src:image.url,alt:image.alt||image.caption||"Изображение карточки",loading:"lazy",onclick:function(){showImage(image)}});fig.appendChild(picture);if(image.caption)fig.appendChild(el("figcaption",{text:image.caption}));   function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
