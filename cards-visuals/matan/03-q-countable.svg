<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Почему рациональные числа счётны</title>
<desc id="desc">Диагональный обход таблицы положительных дробей, затем добавляются ноль и отрицательные дроби.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Почему рациональные числа счётны</text>
<line x1="257" y1="137" x2="333" y2="137" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="337.9013741387857" y1="155.40321216042955" x2="252.09862586121434" y2="204.59678783957045" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="220" y1="260" x2="220" y2="272" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="252.09862586121434" y1="290.5967878395704" x2="337.9013741387857" y2="241.40321216042955" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="402.0986258612143" y1="204.59678783957045" x2="487.9013741387857" y2="155.40321216042955" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="557" y1="137" x2="633" y2="137" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="637.9013741387856" y1="155.40321216042955" x2="552.0986258612144" y2="204.59678783957045" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="487.9013741387857" y1="241.40321216042955" x2="402.0986258612143" y2="290.5967878395704" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="337.9013741387857" y1="327.4032121604296" x2="252.09862586121434" y2="376.5967878395704" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="220" y="145" font-size="25" fill="#1264a3" text-anchor="middle">1/1</text><text x="370" y="145" font-size="25" fill="#1264a3" text-anchor="middle">2/1</text><text x="520" y="145" font-size="25" fill="#1264a3" text-anchor="middle">3/1</text><text x="670" y="145" font-size="25" fill="#1264a3" text-anchor="middle">4/1</text><text x="220" y="231" font-size="25" fill="#1264a3" text-anchor="middle">1/2</text><text x="370" y="231" font-size="25" fill="#52647a" text-anchor="middle">2/2</text><line x1="342" y1="215" x2="398" y2="228" stroke="#ba3434" stroke-width="2"/><text x="520" y="231" font-size="25" fill="#1264a3" text-anchor="middle">3/2</text><text x="670" y="231" font-size=