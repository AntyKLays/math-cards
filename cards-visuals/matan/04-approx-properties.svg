<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Приближения стягиваются к числу</title>
<desc id="desc">Вложенные замкнутые отрезки и вертикальный пунктир через их общую точку x.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Приближения стягиваются к числу</text>
<line x1="460" y1="110" x2="460" y2="430" stroke="#ba3434" stroke-width="2" stroke-dasharray="8 6"/><line x1="145" y1="145" x2="775" y2="145" stroke="#1264a3" stroke-width="9"/><circle cx="145" cy="145" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="775" cy="145" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="66" y="152" font-size="22" fill="#52647a" text-anchor="start">m = 1</text><line x1="265" y1="227" x2="655" y2="227" stroke="#1264a3" stroke-width="9"/><circle cx="265" cy="227" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="655" cy="227" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="66" y="234" font-size="22" fill="#52647a" text-anchor="start">m = 2</text><line x1="370" y1="309" x2="550" y2="309" stroke="#1264a3" stroke-width="9"/><circle cx="370" cy="309" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="550" cy="309" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="66" y="316" font-size="22" fill="#52647a" text-anchor="start">m = 3</text><line x1="426" y1="391" x2="494" y2="391" stroke="#1264a3" stroke-width="9"/><circle cx="426" cy="391" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="494" cy="391" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="66" y="398" font-size="22" fill="#52647a" text-anchor="start">m = 4</text><text x="460" y="98" font-size="26" fill="#ba3434" text-anchor="middle">x</text><text x="450" y="478" font-size="23" fill="#52647a" text-anchor="middle">Нижние границы растут, верхние убывают. Схема без масштаба.</text><text x="450" y="513" font-size="23" fill="#52647a" text-anchor="middle">Каждый следующий отрезок содержит x; длина равна 10⁻ᵐ.</text>
</g>
</svg>
