<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Бесконечно большая: пример Xₙ → +∞</title>
<desc id="desc">График Xn=n: для M=5,5 все члены с n≥6 превосходят M. Это пример положительной бесконечно большой.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Бесконечно большая: пример Xₙ → +∞</text>
<line x1="85" y1="400" x2="800" y2="400" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="85" y1="400" x2="85" y2="92" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><text x="817" y="410" font-size="23" fill="#172b42" text-anchor="middle">n</text><text x="68" y="85" font-size="23" fill="#172b42" text-anchor="middle">Xₙ</text><line x1="85" y1="364.61538461538464" x2="775" y2="364.61538461538464" stroke="#e7edf3" stroke-width="1"/><text x="65" y="371.61538461538464" font-size="21" fill="#172b42" text-anchor="middle">0</text><line x1="115" y1="393" x2="115" y2="407" stroke="#172b42" stroke-width="2"/><text x="115" y="437" font-size="23" fill="#172b42" text-anchor="middle">1</text><line x1="278.6363636363636" y1="393" x2="278.6363636363636" y2="407" stroke="#172b42" stroke-width="2"/><text x="278.6363636363636" y="437" font-size="23" fill="#172b42" text-anchor="middle">4</text><line x1="496.8181818181818" y1="393" x2="496.8181818181818" y2="407" stroke="#172b42" stroke-width="2"/><text x="496.8181818181818" y="437" font-size="23" fill="#172b42" text-anchor="middle">8</text><line x1="715" y1="393" x2="715" y2="407" stroke="#172b42" stroke-width="2"/><text x="715" y="437" font-size="23" fill="#172b42" text-anchor="middle">12</text><line x1="85" y1="252.5" x2="775" y2="252.5" stroke="#ba3434" stroke-width="2" stroke-dasharray="8 6"/><text x="780" y="237.5" font-size="24" fill="#ba3434" text-anchor="end">M = 5,5</text><line x1="387.72727272727275" y1="100" x2="387.72727272727275" y2="400" stroke="#ba3434" stroke-width="2" stroke-dasharray="8 6"/><text x="387.72727272727275" y="86" font-size="24" fill="#ba3434" text-anchor="middle">N = 6</text><circle cx="115" cy="344.2307692307692" r="6" fill="#52647a" stroke="#52647a" stroke-width="2.5"/><circle cx="169.54545454545456" cy="323.84615384615387" r="6" fill="#52647a" stroke="#52647a" stroke-width="2.5"/><circle cx="224.0909090909091" cy="303.46153846153845" r="6" fill="#52647a" stroke="#52647a" stroke-width="2.5"/><circle cx="278.6363636363636" cy="283.0769230769231" r="6" fill="#52647a" stroke="#52647a" stroke-width="2.5"/><circle cx="333.1818181818182" cy="262.6923076923077" r="6" fill="#52647a" stroke="#52647a" stroke-width="2.5"/><circle cx="387.72727272727275" cy="242.30769230769232" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="442.27272727272725" cy="221.92307692307693" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="496.8181818181818" cy="201.53846153846155" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="551.3636363636364" cy="181.15384615384616" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="605.909090909091" cy="160.76923076923077" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="660.4545454545455" cy="140.3846153846154" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="715" cy="120" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="450" y="478" font-size="23" fill="#52647a" text-anchor="middle">Пример Xₙ = n → +∞: для любого M весь хвост будет выше M.</text><text x="450" y="513" font-size="23" fill="#52647a" text-anchor="middle">Бесконечно большая в общем случае: |Xₙ| → ∞, знак может меняться.</text>
</g>
</svg>
