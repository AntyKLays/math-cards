<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Неравенство треугольника для векторов</title>
<desc id="desc">Второй вектор отложен от конца первого; прямая сумма не длиннее двух последовательных сторон.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Неравенство треугольника для векторов</text>
<line x1="190" y1="390" x2="510" y2="350" stroke="#1264a3" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="510" y1="350" x2="670" y2="150" stroke="#18734b" stroke-width="4" marker-end="url(#arrow-green)"/><line x1="190" y1="390" x2="670" y2="150" stroke="#ba3434" stroke-width="4" marker-end="url(#arrow-red)"/><text x="350" y="405" font-size="29" fill="#1264a3" text-anchor="middle">u</text><text x="640" y="280" font-size="29" fill="#18734b" text-anchor="middle">v</text><text x="400" y="240" font-size="29" fill="#ba3434" text-anchor="middle">u + v</text><text x="450" y="95" font-size="31" fill="#172b42" text-anchor="middle">|u + v| ≤ |u| + |v|</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Прямой путь не длиннее пути по двум сторонам треугольника.</text>
</g>
</svg>
