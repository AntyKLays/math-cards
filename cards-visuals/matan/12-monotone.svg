<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Четыре типа монотонности</title>
<desc id="desc">Четыре отдельных дискретных графика: строгое возрастание, неубывание с равными соседями, строгое убывание и невозрастание.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Четыре типа монотонности</text>
<text x="75" y="95" font-size="23" fill="#172b42" text-anchor="start">Возрастает: Xₙ₊₁ &gt; Xₙ</text><line x1="90" y1="240" x2="385" y2="240" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="90" y1="240" x2="90" y2="125" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><circle cx="125" cy="220" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="179" cy="199" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="233" cy="178" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="287" cy="157" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="341" cy="136" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="495" y="95" font-size="23" fill="#172b42" text-anchor="start">Не убывает: Xₙ₊₁ ≥ Xₙ</text><line x1="510" y1="240" x2="805" y2="240" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="510" y1="240" x2="510" y2="125" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><circle cx="545" cy="220" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="599" cy="199" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="653" cy="199" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="707" cy="178" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="761" cy="157" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="75" y="290" font-size="23" fill="#172b42" text-anchor="start">Убывает: Xₙ₊₁ &lt; Xₙ</text><line x1="90" y1="435" x2="385" y2="435" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="90" y1="435" x2="90" y2="320" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><circle cx="125" cy="331" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="179" cy="352" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="233" cy="373" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="287" cy="394" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="341" cy="415" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="495" y="290" font-size="23" fill="#172b42" text-anchor="start">Не возрастает: Xₙ₊₁ ≤ Xₙ</text><line x1="510" y1="435" x2="805" y2="435" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="510" y1="435" x2="510" y2="320" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><circle cx="545" cy="352" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="599" cy="373" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="653" cy="373" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="707" cy="394" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="761" cy="415" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Нестрогие варианты допускают равные соседние члены.</text>
</g>
</svg>
