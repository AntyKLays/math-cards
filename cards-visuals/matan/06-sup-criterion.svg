<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Как узнать верхнюю грань</title>
<desc id="desc">В полосе от M−ε до M есть элемент A при любом ε&gt;0; все элементы не больше M.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Как узнать верхнюю грань</text>
<rect x="445" y="210" width="245" height="115" fill="#dcecf9" stroke="none"/><line x1="85" y1="290" x2="815" y2="290" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="160" y1="290" x2="690" y2="290" stroke="#1264a3" stroke-width="9"/><circle cx="160" cy="290" r="8" fill="#fff" stroke="#1264a3" stroke-width="2.5"/><circle cx="690" cy="290" r="8" fill="#fff" stroke="#1264a3" stroke-width="2.5"/><line x1="445" y1="283" x2="445" y2="297" stroke="#52647a" stroke-width="2"/><text x="445" y="327" font-size="23" fill="#52647a" text-anchor="middle">M − ε</text><text x="690" y="327" font-size="23" fill="#ba3434" text-anchor="middle">M = sup A</text><circle cx="600" cy="290" r="8" fill="#ba3434" stroke="#ba3434" stroke-width="2.5"/><text x="600" y="265" font-size="26" fill="#ba3434" text-anchor="middle">a</text><text x="450" y="120" font-size="25" fill="#172b42" text-anchor="middle">Пример: A — открытый интервал с правым концом M</text><text x="570" y="177" font-size="25" fill="#1264a3" text-anchor="middle">здесь найдётся a ∈ A</text><text x="450" y="405" font-size="30" fill="#172b42" text-anchor="middle">M − ε &lt; a &lt; M</text><text x="450" y="478" font-size="23" fill="#52647a" text-anchor="middle">M ограничивает A сверху.</text><text x="450" y="513" font-size="23" fill="#52647a" text-anchor="middle">Но любая меньшая граница M − ε пропускает какой-то элемент A.</text>
</g>
</svg>
