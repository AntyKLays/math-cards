<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Принадлежность множеству</title>
<desc id="desc">Точки a и b внутри множества A; точка c вне A.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Принадлежность множеству</text>
<ellipse cx="360" cy="265" rx="200" ry="135" fill="#dcecf9" stroke="#1264a3" stroke-width="3"/><text x="360" y="108" font-size="25" fill="#1264a3" text-anchor="middle">Множество A</text><circle cx="285" cy="255" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="285" y="298" font-size="26" fill="#172b42" text-anchor="middle">a</text><circle cx="415" cy="215" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="415" y="258" font-size="26" fill="#172b42" text-anchor="middle">b</text><circle cx="690" cy="280" r="6" fill="#ba3434" stroke="#ba3434" stroke-width="2.5"/><text x="690" y="323" font-size="26" fill="#ba3434" text-anchor="middle">c</text><text x="345" y="432" font-size="27" fill="#1264a3" text-anchor="middle">a ∈ A, b ∈ A</text><text x="690" y="432" font-size="27" fill="#ba3434" text-anchor="middle">c ∉ A</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Внутри контура — элементы A. Снаружи — не элементы A.</text>
</g>
</svg>
