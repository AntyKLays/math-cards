<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Неограниченность сверху и снизу</title>
<desc id="desc">Натуральные числа продолжаются вправо без конечной верхней границы; целые продолжаются влево и вправо и не ограничены снизу.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Неограниченность сверху и снизу</text>
<text x="170" y="135" font-size="27" fill="#1264a3" text-anchor="middle">A = ℕ</text><line x1="85" y1="195" x2="815" y2="195" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><circle cx="200" cy="195" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="200" y="235" font-size="23" fill="#172b42" text-anchor="middle">1</text><circle cx="285" cy="195" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="285" y="235" font-size="23" fill="#172b42" text-anchor="middle">2</text><circle cx="370" cy="195" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="370" y="235" font-size="23" fill="#172b42" text-anchor="middle">3</text><circle cx="455" cy="195" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="455" y="235" font-size="23" fill="#172b42" text-anchor="middle">4</text><circle cx="540" cy="195" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="540" y="235" font-size="23" fill="#172b42" text-anchor="middle">5</text><circle cx="625" cy="195" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="625" y="235" font-size="23" fill="#172b42" text-anchor="middle">6</text><circle cx="710" cy="195" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="710" y="235" font-size="23" fill="#172b42" text-anchor="middle">7</text><text x="765" y="188" font-size="27" fill="#1264a3" text-anchor="middle">…</text><text x="450" y="285" font-size="25" fill="#172b42" text-anchor="middle">sup ℕ = +∞: нет конечной верхней оценки</text><line x1="85" y1="350" x2="815" y2="350" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><circle cx="200" cy="350" r="6" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><text x="200" y="390" font-size="23" fill="#172b42" text-anchor="middle">-3</text><circle cx="285" cy="350" r="6" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><text x="285" y="390" font-size="23" fill="#172b42" text-anchor="middle">-2</text><circle cx="370" cy="350" r="6" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><text x="370" y="390" font-size="23" fill="#172b42" text-anchor="middle">-1</text><circle cx="455" cy="350" r="6" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><text x="455" y="390" font-size="23" fill="#172b42" text-anchor="middle">0</text><circle cx="540" cy="350" r="6" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><text x="540" y="390" font-size="23" fill="#172b42" text-anchor="middle">1</text><circle cx="625" cy="350" r="6" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><text x="625" y="390" font-size="23" fill="#172b42" text-anchor="middle">2</text><circle cx="710" cy="350" r="6" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><text x="710" y="390" font-size="23" fill="#172b42" text-anchor="middle">3</text><text x="140" y="342" font-size="27" fill="#18734b" text-anchor="middle">…</text><text x="765" y="342" font-size="27" fill="#18734b" text-anchor="middle">…</text><text x="450" y="438" font-size="25" fill="#18734b" text-anchor="middle">inf ℤ = −∞: целые продолжаются влево без конца</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">±∞ обозначают отсутствие конечной грани, а не элементы ℝ.</text>
</g>
</svg>
