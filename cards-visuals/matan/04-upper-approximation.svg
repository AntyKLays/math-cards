<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Верхнее десятичное приближение</title>
<desc id="desc">Пример x=1,414213…: нижнее приближение 1,41, верхнее 1,42; x находится между ними.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Верхнее десятичное приближение</text>
<text x="450" y="105" font-size="27" fill="#172b42" text-anchor="middle">Пример: x = 1,414213…;  m = 2</text><line x1="85" y1="285" x2="815" y2="285" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="210" y1="285" x2="690" y2="285" stroke="#b4c9df" stroke-width="9"/><circle cx="210" cy="285" r="8" fill="#b4c9df" stroke="#b4c9df" stroke-width="2.5"/><circle cx="690" cy="285" r="8" fill="#b4c9df" stroke="#b4c9df" stroke-width="2.5"/><circle cx="412" cy="285" r="8" fill="#ba3434" stroke="#ba3434" stroke-width="2.5"/><text x="210" y="235" font-size="26" fill="#1264a3" text-anchor="middle">x₂ = 1,41</text><text x="690" y="235" font-size="26" fill="#1264a3" text-anchor="middle">x̄₂ = 1,42</text><text x="412" y="338" font-size="26" fill="#ba3434" text-anchor="middle">x = 1,414213…</text><line x1="210" y1="390" x2="690" y2="390" stroke="#1264a3" stroke-width="2"/><line x1="210" y1="382" x2="210" y2="398" stroke="#1264a3" stroke-width="2"/><line x1="690" y1="382" x2="690" y2="398" stroke="#1264a3" stroke-width="2"/><text x="450" y="430" font-size="26" fill="#172b42" text-anchor="middle">x̄₂ − x₂ = 0,01 = 10⁻²</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">К нижнему приближению прибавляем 10⁻ᵐ: x ≤ x̄₂.</text>
</g>
</svg>
