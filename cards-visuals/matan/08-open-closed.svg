<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Открытый интервал и замкнутый отрезок</title>
<desc id="desc">Открытый интервал (a,b) не содержит концов, замкнутый отрезок [a,b] содержит оба конца.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Открытый интервал и замкнутый отрезок</text>
<text x="450" y="115" font-size="26" fill="#52647a" text-anchor="middle">Примеры на числовой прямой</text><line x1="85" y1="220" x2="815" y2="220" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="230" y1="220" x2="670" y2="220" stroke="#1264a3" stroke-width="9"/><circle cx="230" cy="220" r="8" fill="#fff" stroke="#1264a3" stroke-width="2.5"/><circle cx="670" cy="220" r="8" fill="#fff" stroke="#1264a3" stroke-width="2.5"/><text x="230" y="265" font-size="24" fill="#172b42" text-anchor="middle">a</text><text x="670" y="265" font-size="24" fill="#172b42" text-anchor="middle">b</text><text x="450" y="175" font-size="28" fill="#1264a3" text-anchor="middle">(a; b) — открытое</text><line x1="85" y1="380" x2="815" y2="380" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="230" y1="380" x2="670" y2="380" stroke="#18734b" stroke-width="9"/><circle cx="230" cy="380" r="8" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><circle cx="670" cy="380" r="8" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><text x="230" y="425" font-size="24" fill="#172b42" text-anchor="middle">a</text><text x="670" y="425" font-size="24" fill="#172b42" text-anchor="middle">b</text><text x="450" y="335" font-size="28" fill="#18734b" text-anchor="middle">[a; b] — замкнутое</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Пустой кружок: конец исключён. Закрашенный: включён.</text>
</g>
</svg>
