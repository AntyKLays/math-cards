<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Предельная точка может не лежать в A</title>
<desc id="desc">Для A={1/n} точка 0 предельная, хотя не принадлежит A; элементы сгущаются к нулю.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Предельная точка может не лежать в A</text>
<line x1="85" y1="290" x2="815" y2="290" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><rect x="230" y="205" width="440" height="85" fill="#dcecf9" stroke="none"/><circle cx="450" cy="290" r="9" fill="#fff" stroke="#ba3434" stroke-width="2.5"/><text x="450" y="350" font-size="27" fill="#ba3434" text-anchor="middle">0</text><circle cx="750" cy="290" r="5" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="600" cy="290" r="5" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="550" cy="290" r="5" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="525" cy="290" r="5" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="500" cy="290" r="5" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="483.3333333333333" cy="290" r="5" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="471.42857142857144" cy="290" r="5" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="462.5" cy="290" r="5" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="450" y="120" font-size="29" fill="#1264a3" text-anchor="middle">A = {1, 1/2, 1/3, …}</text><text x="250" y="190" font-size="25" fill="#172b42" text-anchor="middle">−ε</text><text x="650" y="190" font-size="25" fill="#172b42" text-anchor="middle">ε</text><text x="450" y="478" font-size="23" fill="#52647a" text-anchor="middle">0 ∉ A, но в любой окрестности 0 есть точки 1/n.</text><text x="450" y="513" font-size="23" fill="#52647a" text-anchor="middle">Все эти точки отличны от 0: это предельная точка A.</text>
</g>
</svg>
