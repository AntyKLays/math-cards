<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Распределительный закон</title>
<desc id="desc">Закрашена часть C, которая принадлежит A или B; обе стороны распределительного закона совпадают.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Распределительный закон</text>
<defs><clipPath id="dis-c"><circle cx="450" cy="335" r="115"/></clipPath></defs><g clip-path="url(#dis-c)"><circle cx="380" cy="235" r="115" fill="#dcecf9" stroke="none" stroke-width="2.5"/><circle cx="520" cy="235" r="115" fill="#dcecf9" stroke="none" stroke-width="2.5"/></g><circle cx="380" cy="235" r="115" fill="none" stroke="#172b42" stroke-width="2.5"/><circle cx="520" cy="235" r="115" fill="none" stroke="#172b42" stroke-width="2.5"/><circle cx="450" cy="335" r="115" fill="none" stroke="#172b42" stroke-width="2.5"/><text x="278" y="151" font-size="26" fill="#172b42" text-anchor="middle">A</text><text x="621" y="151" font-size="26" fill="#172b42" text-anchor="middle">B</text><text x="580" y="395" font-size="26" fill="#172b42" text-anchor="middle">C</text><text x="450" y="90" font-size="26" fill="#172b42" text-anchor="middle">(A ∪ B) ∩ C = (A ∩ C) ∪ (B ∩ C)</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Обе части равенства задают одну закрашенную область.</text>
</g>
</svg>
