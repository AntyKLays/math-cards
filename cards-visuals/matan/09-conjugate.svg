<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Сопряжённое число: отражение</title>
<desc id="desc">Точки z и сопряжённая z симметричны относительно горизонтальной действительной оси.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Сопряжённое число: отражение</text>
<line x1="140" y1="432" x2="140" y2="108" stroke="#e7edf3" stroke-width="1"/><line x1="230" y1="432" x2="230" y2="108" stroke="#e7edf3" stroke-width="1"/><line x1="320" y1="432" x2="320" y2="108" stroke="#e7edf3" stroke-width="1"/><line x1="410" y1="432" x2="410" y2="108" stroke="#e7edf3" stroke-width="1"/><line x1="500" y1="432" x2="500" y2="108" stroke="#e7edf3" stroke-width="1"/><line x1="590" y1="432" x2="590" y2="108" stroke="#e7edf3" stroke-width="1"/><line x1="680" y1="432" x2="680" y2="108" stroke="#e7edf3" stroke-width="1"/><line x1="140" y1="360" x2="743" y2="360" stroke="#e7edf3" stroke-width="1"/><line x1="140" y1="270" x2="743" y2="270" stroke="#e7edf3" stroke-width="1"/><line x1="140" y1="180" x2="743" y2="180" stroke="#e7edf3" stroke-width="1"/><line x1="140" y1="270" x2="743" y2="270" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="230" y1="432" x2="230" y2="108" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><text x="755" y="277" font-size="22" fill="#172b42" text-anchor="start">Re z</text><text x="244" y="98" font-size="22" fill="#172b42" text-anchor="start">Im z</text><text x="213" y="297" font-size="21" fill="#172b42" text-anchor="middle">0</text><line x1="500" y1="144" x2="500" y2="396" stroke="#52647a" stroke-width="2" stroke-dasharray="8 6"/><line x1="230" y1="270" x2="500" y2="144" stroke="#1264a3" stroke-width="3"/><circle cx="500" cy="144" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="520" y="129" font-size="27" fill="#1264a3" text-anchor="start">z = x + iy</text><line x1="230" y1="270" x2="500" y2="396" stroke="#ba3434" stroke-width="3"/><circle cx="500" cy="396" r="6" fill="#ba3434" stroke="#ba3434" stroke-width="2.5"/><text x="520" y="431" font-size="27" fill="#ba3434" text-anchor="start">z̄ = x − iy</text><text x="450" y="478" font-size="23" fill="#52647a" text-anchor="middle">Сопряжение отражает точку относительно действительной оси.</text><text x="450" y="513" font-size="23" fill="#52647a" text-anchor="middle">Действительная часть сохраняется, мнимая меняет знак.</text>
</g>
</svg>
