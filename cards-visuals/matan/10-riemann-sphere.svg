<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Стереографическая проекция</title>
<desc id="desc">Меридиональное сечение: N, P и z лежат на одной прямой; плоскость касается сферы в южном полюсе 0.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Стереографическая проекция</text>
<line x1="110" y1="405" x2="820" y2="405" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><text x="765" y="440" font-size="24" fill="#172b42" text-anchor="middle">Плоскость ℂ</text><circle cx="400" cy="260" r="145" fill="#eef5fb" stroke="#1264a3" stroke-width="2.5"/><line x1="400" y1="115" x2="690" y2="405" stroke="#ba3434" stroke-width="3"/><circle cx="400" cy="115" r="6" fill="#ba3434" stroke="#ba3434" stroke-width="2.5"/><circle cx="545" cy="260" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="690" cy="405" r="6" fill="#ba3434" stroke="#ba3434" stroke-width="2.5"/><text x="365" y="140" font-size="26" fill="#ba3434" text-anchor="end">N ↔ ∞</text><text x="567" y="248" font-size="27" fill="#1264a3" text-anchor="start">P</text><text x="710" y="390" font-size="28" fill="#ba3434" text-anchor="start">z</text><circle cx="400" cy="405" r="4" fill="#172b42" stroke="#172b42" stroke-width="2.5"/><text x="380" y="437" font-size="24" fill="#172b42" text-anchor="middle">0</text><text x="450" y="83" font-size="24" fill="#52647a" text-anchor="middle">Сечение сферы и плоскости через N, P и z</text><text x="450" y="478" font-size="23" fill="#52647a" text-anchor="middle">Проводим прямую NP: её пересечение с плоскостью — точка z.</text><text x="450" y="513" font-size="23" fill="#52647a" text-anchor="middle">Северный полюс N соответствует бесконечно удалённой точке ∞.</text>
</g>
</svg>
