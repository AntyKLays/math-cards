<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Перенумерация подмножества</title>
<desc id="desc">Выбранные a1, a4, a6 перенумерованы как x1, x2, x3.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Перенумерация подмножества</text>
<text x="170" y="160" font-size="26" fill="#1264a3" text-anchor="middle">a1</text><circle cx="170" cy="205" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><line x1="170" y1="225" x2="170" y2="315" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="170" y="360" font-size="26" fill="#1264a3" text-anchor="middle">x1</text><text x="265" y="160" font-size="26" fill="#52647a" text-anchor="middle">a2</text><circle cx="265" cy="205" r="6" fill="#fff" stroke="#52647a" stroke-width="2.5"/><text x="360" y="160" font-size="26" fill="#52647a" text-anchor="middle">a3</text><circle cx="360" cy="205" r="6" fill="#fff" stroke="#52647a" stroke-width="2.5"/><text x="455" y="160" font-size="26" fill="#1264a3" text-anchor="middle">a4</text><circle cx="455" cy="205" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><line x1="455" y1="225" x2="455" y2="315" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="455" y="360" font-size="26" fill="#1264a3" text-anchor="middle">x2</text><text x="550" y="160" font-size="26" fill="#52647a" text-anchor="middle">a5</text><circle cx="550" cy="205" r="6" fill="#fff" stroke="#52647a" stroke-width="2.5"/><text x="645" y="160" font-size="26" fill="#1264a3" text-anchor="middle">a6</text><circle cx="645" cy="205" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><line x1="645" y1="225" x2="645" y2="315" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="645" y="360" font-size="26" fill="#1264a3" text-anchor="middle">x3</text><text x="740" y="160" font-size="26" fill="#52647a" text-anchor="middle">a7</text><circle cx="740" cy="205" r="6" fill="#fff" stroke="#52647a" stroke-width="2.5"/><text x="450" y="95" font-size="25" fill="#172b42" text-anchor="middle">Исходный порядок в A</text><text x="450" y="420" font-size="26" fill="#172b42" text-anchor="middle">X = {a₁, a₄, a₆, …} = {x₁, x₂, x₃, …}</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Сохраняем выбранные элементы и даём им новые номера подряд.</text>
</g>
</svg>
