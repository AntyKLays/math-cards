<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Число — координата точки на прямой</title>
<desc id="desc">Единичный отрезок от нуля до единицы задаёт масштаб; число 1,414213… отмечено между 1 и 2.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Число — координата точки на прямой</text>
<line x1="100" y1="285" x2="800" y2="285" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="160" y1="278" x2="160" y2="292" stroke="#172b42" stroke-width="2"/><text x="160" y="322" font-size="23" fill="#172b42" text-anchor="middle">0</text><line x1="340" y1="278" x2="340" y2="292" stroke="#172b42" stroke-width="2"/><text x="340" y="322" font-size="23" fill="#172b42" text-anchor="middle">1</text><line x1="520" y1="278" x2="520" y2="292" stroke="#172b42" stroke-width="2"/><text x="520" y="322" font-size="23" fill="#172b42" text-anchor="middle">2</text><line x1="700" y1="278" x2="700" y2="292" stroke="#172b42" stroke-width="2"/><text x="700" y="322" font-size="23" fill="#172b42" text-anchor="middle">3</text><circle cx="415" cy="285" r="8" fill="#ba3434" stroke="#ba3434" stroke-width="2.5"/><text x="415" y="225" font-size="28" fill="#ba3434" text-anchor="middle">M ↔ x = 1,414213…</text><line x1="160" y1="370" x2="340" y2="370" stroke="#1264a3" stroke-width="4"/><text x="250" y="415" font-size="23" fill="#1264a3" text-anchor="middle">Единичный отрезок</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Каждому вещественному числу соответствует одна точка прямой.</text>
</g>
</svg>
