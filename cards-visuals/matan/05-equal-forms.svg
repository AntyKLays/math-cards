<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Две десятичные записи одной точки</title>
<desc id="desc">Записи 0,5000… и 0,4999… обозначают одну точку 0,5.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Две десятичные записи одной точки</text>
<line x1="85" y1="305" x2="815" y2="305" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="170" y1="298" x2="170" y2="312" stroke="#172b42" stroke-width="2"/><text x="170" y="342" font-size="23" fill="#172b42" text-anchor="middle">0,4</text><line x1="730" y1="298" x2="730" y2="312" stroke="#172b42" stroke-width="2"/><text x="730" y="342" font-size="23" fill="#172b42" text-anchor="middle">0,6</text><circle cx="450" cy="305" r="9" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="450" y="185" font-size="32" fill="#1264a3" text-anchor="middle">0,5000…</text><text x="450" y="235" font-size="32" fill="#1264a3" text-anchor="middle">= 0,4999…</text><line x1="450" y1="250" x2="450" y2="285" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="450" y="355" font-size="27" fill="#172b42" text-anchor="middle">0,5</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Бесконечная запись 0,4999… — это ровно 0,5, не число рядом.</text>
</g>
</svg>
