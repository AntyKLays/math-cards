<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Грани не всегда принадлежат множеству</title>
<desc id="desc">Интервал (0,1]: нижняя грань 0 исключена, верхняя грань 1 включена.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Грани не всегда принадлежат множеству</text>
<text x="450" y="115" font-size="29" fill="#172b42" text-anchor="middle">Пример: A = (0; 1]</text><line x1="85" y1="270" x2="815" y2="270" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="230" y1="270" x2="670" y2="270" stroke="#1264a3" stroke-width="10"/><circle cx="230" cy="270" r="10" fill="#fff" stroke="#1264a3" stroke-width="2.5"/><circle cx="670" cy="270" r="10" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="230" y="325" font-size="27" fill="#172b42" text-anchor="middle">0 = inf A</text><text x="670" y="325" font-size="27" fill="#172b42" text-anchor="middle">1 = sup A</text><text x="230" y="380" font-size="26" fill="#ba3434" text-anchor="middle">0 ∉ A</text><text x="670" y="380" font-size="26" fill="#1264a3" text-anchor="middle">1 ∈ A</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">inf A — наибольшая нижняя оценка; sup A — наименьшая верхняя.</text>
</g>
</svg>
