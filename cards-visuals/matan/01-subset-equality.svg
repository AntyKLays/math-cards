<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Подмножество и равенство</title>
<desc id="desc">Слева A целиком внутри B. Справа A и B совпадают.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Подмножество и равенство</text>
<ellipse cx="280" cy="265" rx="180" ry="132" fill="none" stroke="#172b42" stroke-width="3"/><ellipse cx="255" cy="280" rx="100" ry="74" fill="#dcecf9" stroke="#1264a3" stroke-width="3"/><text x="255" y="287" font-size="30" fill="#1264a3" text-anchor="middle">A</text><text x="375" y="205" font-size="30" fill="#172b42" text-anchor="middle">B</text><text x="280" y="435" font-size="28" fill="#172b42" text-anchor="middle">A ⊂ B</text><circle cx="665" cy="265" r="125" fill="#dcecf9" stroke="#1264a3" stroke-width="2.5"/><text x="665" y="274" font-size="30" fill="#1264a3" text-anchor="middle">A = B</text><text x="665" y="435" font-size="26" fill="#172b42" text-anchor="middle">A ⊂ B и B ⊂ A</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Подмножество: каждый элемент A лежит в B.</text>
</g>
</svg>
