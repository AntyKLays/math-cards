<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Аксиома Архимеда: достаточно единичных шагов</title>
<desc id="desc">Семь единичных шагов от нуля дают 7 и превосходят число 6,1.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Аксиома Архимеда: достаточно единичных шагов</text>
<line x1="85" y1="285" x2="815" y2="285" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="150" y1="278" x2="150" y2="292" stroke="#172b42" stroke-width="2"/><text x="150" y="322" font-size="23" fill="#172b42" text-anchor="middle">0</text><line x1="232" y1="278" x2="232" y2="292" stroke="#172b42" stroke-width="2"/><text x="232" y="322" font-size="23" fill="#172b42" text-anchor="middle">1</text><path d="M 150 258 Q 191 188 232 258" fill="none" stroke="#1264a3" stroke-width="2"/><line x1="314" y1="278" x2="314" y2="292" stroke="#172b42" stroke-width="2"/><text x="314" y="322" font-size="23" fill="#172b42" text-anchor="middle">2</text><path d="M 232 258 Q 273 188 314 258" fill="none" stroke="#1264a3" stroke-width="2"/><line x1="396" y1="278" x2="396" y2="292" stroke="#172b42" stroke-width="2"/><text x="396" y="322" font-size="23" fill="#172b42" text-anchor="middle">3</text><path d="M 314 258 Q 355 188 396 258" fill="none" stroke="#1264a3" stroke-width="2"/><line x1="478" y1="278" x2="478" y2="292" stroke="#172b42" stroke-width="2"/><text x="478" y="322" font-size="23" fill="#172b42" text-anchor="middle">4</text><path d="M 396 258 Q 437 188 478 258" fill="none" stroke="#1264a3" stroke-width="2"/><line x1="560" y1="278" x2="560" y2="292" stroke="#172b42" stroke-width="2"/><text x="560" y="322" font-size="23" fill="#172b42" text-anchor="middle">5</text><path d="M 478 258 Q 519 188 560 258" fill="none" stroke="#1264a3" stroke-width="2"/><line x1="642" y1="278" x2="642" y2="292" stroke="#172b42" stroke-width="2"/><text x="642" y="322" font-size="23" fill="#172b42" text-anchor="middle">6</text><path d="M 560 258 Q 601 188 642 258" fill="none" stroke="#1264a3" stroke-width="2"/><line x1="724" y1="278" x2="724" y2="292" stroke="#172b42" stroke-width="2"/><text x="724" y="322" font-size="23" fill="#172b42" text-anchor="middle">7</text><path d="M 642 258 Q 683 188 724 258" fill="none" stroke="#1264a3" stroke-width="2"/><circle cx="650" cy="285" r="6" fill="#ba3434" stroke="#ba3434" stroke-width="2.5"/><text x="650" y="375" font-size="26" fill="#ba3434" text-anchor="middle">a = 6,1</text><text x="450" y="130" font-size="28" fill="#1264a3" text-anchor="middle">Каждый шаг прибавляет 1</text><text x="450" y="420" font-size="30" fill="#172b42" text-anchor="middle">7 · 1 = 7 &gt; 6,1</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Для любого a найдётся натуральное n &gt; a.</text>
</g>
</svg>
