<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Оценки суммы</title>
<desc id="desc">Сумма чисел из [1,4;1,5] и [2,7;2,8] находится в [4,1;4,3].</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Оценки суммы</text>
<text x="450" y="110" font-size="27" fill="#172b42" text-anchor="middle">Пример: 1,4 ≤ x ≤ 1,5;   2,7 ≤ y ≤ 2,8</text><text x="450" y="174" font-size="28" fill="#172b42" text-anchor="middle">1,4 + 2,7 ≤ x + y ≤ 1,5 + 2,8</text><line x1="85" y1="305" x2="815" y2="305" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="220" y1="305" x2="680" y2="305" stroke="#1264a3" stroke-width="9"/><circle cx="220" cy="305" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="680" cy="305" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="220" y="355" font-size="26" fill="#172b42" text-anchor="middle">4,1</text><text x="680" y="355" font-size="26" fill="#172b42" text-anchor="middle">4,3</text><text x="450" y="265" font-size="29" fill="#1264a3" text-anchor="middle">x + y</text><text x="450" y="415" font-size="29" fill="#172b42" text-anchor="middle">α₁ + β₁ ≤ x + y ≤ α₂ + β₂</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Складываем нижние границы отдельно от верхних.</text>
</g>
</svg>
