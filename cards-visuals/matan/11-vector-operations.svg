<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Сумма и разность: разные построения</title>
<desc id="desc">Слева сумма по правилу параллелограмма. Справа разность u−v направлена от конца v к концу u.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Сумма и разность: разные построения</text>
<text x="245" y="105" font-size="28" fill="#172b42" text-anchor="middle">Сумма u + v</text><line x1="90" y1="405" x2="290" y2="335" stroke="#1264a3" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="90" y1="405" x2="180" y2="225" stroke="#18734b" stroke-width="3" marker-end="url(#arrow-green)"/><text x="310" y="360" font-size="27" fill="#1264a3" text-anchor="middle">u</text><text x="160" y="213" font-size="27" fill="#18734b" text-anchor="middle">v</text><line x1="290" y1="335" x2="380" y2="155" stroke="#18734b" stroke-width="2" stroke-dasharray="8 6"/><line x1="180" y1="225" x2="380" y2="155" stroke="#1264a3" stroke-width="2" stroke-dasharray="8 6"/><line x1="90" y1="405" x2="380" y2="155" stroke="#ba3434" stroke-width="3" marker-end="url(#arrow-red)"/><text x="245" y="240" font-size="25" fill="#ba3434" text-anchor="middle">u + v</text><text x="675" y="105" font-size="28" fill="#172b42" text-anchor="middle">Разность u − v</text><line x1="520" y1="405" x2="720" y2="335" stroke="#1264a3" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="520" y1="405" x2="610" y2="225" stroke="#18734b" stroke-width="3" marker-end="url(#arrow-green)"/><text x="740" y="360" font-size="27" fill="#1264a3" text-anchor="middle">u</text><text x="590" y="213" font-size="27" fill="#18734b" text-anchor="middle">v</text><line x1="610" y1="225" x2="720" y2="335" stroke="#ba3434" stroke-width="4" marker-end="url(#arrow-red)"/><text x="735" y="265" font-size="26" fill="#ba3434" text-anchor="middle">u − v</text><text x="450" y="478" font-size="23" fill="#52647a" text-anchor="middle">Сумма — диагональ параллелограмма.</text><text x="450" y="513" font-size="23" fill="#52647a" text-anchor="middle">Разность u − v направлена от конца v к концу u.</text>
</g>
</svg>
