<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Геометрический смысл a² и a³</title>
<desc id="desc">Квадрат со стороной a и куб с ребром a иллюстрируют площадь a² и объём a³.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Геометрический смысл a² и a³</text>
<rect x="130" y="180" width="210" height="210" fill="#dcecf9" stroke="#1264a3"/><text x="235" y="299" font-size="38" fill="#1264a3" text-anchor="middle">a²</text><text x="235" y="435" font-size="27" fill="#172b42" text-anchor="middle">a</text><text x="95" y="295" font-size="27" fill="#172b42" text-anchor="middle">a</text><path d="M540 240 L650 150 L800 150 L800 320 L690 410 L540 410 Z" fill="#eef5fb" stroke="#1264a3" stroke-width="2.5"/><polyline points="540,240 690,240 800,150" fill="none" stroke="#1264a3" stroke-width="3"/><polyline points="690,240 690,410" fill="none" stroke="#1264a3" stroke-width="3"/><text x="614" y="337" font-size="36" fill="#1264a3" text-anchor="middle">a³</text><text x="614" y="440" font-size="27" fill="#172b42" text-anchor="middle">a</text><text x="748" y="392" font-size="27" fill="#172b42" text-anchor="middle">a</text><text x="819" y="249" font-size="27" fill="#172b42" text-anchor="middle">a</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Для a &gt; 0: a² — площадь квадрата, a³ — объём куба.</text>
</g>
</svg>
