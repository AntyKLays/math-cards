<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Декартово произведение A × B</title>
<desc id="desc">Шесть пар: (1,a), (1,b), (2,a), (2,b), (3,a), (3,b).</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Декартово произведение A × B</text>
<text x="450" y="92" font-size="26" fill="#172b42" text-anchor="middle">A = {1, 2, 3},   B = {a, b}</text><line x1="190" y1="380" x2="750" y2="380" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="190" y1="380" x2="190" y2="125" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><text x="778" y="386" font-size="25" fill="#172b42" text-anchor="middle">A</text><text x="170" y="113" font-size="25" fill="#172b42" text-anchor="middle">B</text><line x1="310" y1="373" x2="310" y2="387" stroke="#172b42" stroke-width="2"/><text x="310" y="417" font-size="23" fill="#172b42" text-anchor="middle">1</text><line x1="310" y1="380" x2="310" y2="290" stroke="#e7edf3" stroke-width="1"/><circle cx="310" cy="290" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="310" y="271" font-size="24" fill="#1264a3" text-anchor="middle">(1, a)</text><line x1="310" y1="380" x2="310" y2="180" stroke="#e7edf3" stroke-width="1"/><circle cx="310" cy="180" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="310" y="161" font-size="24" fill="#1264a3" text-anchor="middle">(1, b)</text><line x1="480" y1="373" x2="480" y2="387" stroke="#172b42" stroke-width="2"/><text x="480" y="417" font-size="23" fill="#172b42" text-anchor="middle">2</text><line x1="480" y1="380" x2="480" y2="290" stroke="#e7edf3" stroke-width="1"/><circle cx="480" cy="290" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="480" y="271" font-size="24" fill="#1264a3" text-anchor="middle">(2, a)</text><line x1="480" y1="380" x2="480" y2="180" stroke="#e7edf3" stroke-width="1"/><circle cx="480" cy="180" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="480" y="161" font-size="24" fill="#1264a3" text-anchor="middle">(2, b)</text><line x1="650" y1="373" x2="650" y2="387" stroke="#172b42" stroke-width="2"/><text x="650" y="417" font-size="23" fill="#172b42" text-anchor="middle">3</text><line x1="650" y1="380" x2="650" y2="290" stroke="#e7edf3" stroke-width="1"/><circle cx="650" cy="290" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="650" y="271" font-size="24" fill="#1264a3" text-anchor="middle">(3, a)</text><line x1="650" y1="380" x2="650" y2="180" stroke="#e7edf3" stroke-width="1"/><circle cx="650" cy="180" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="650" y="161" font-size="24" fill="#1264a3" text-anchor="middle">(3, b)</text><text x="164" y="298" font-size="24" fill="#172b42" text-anchor="middle">a</text><text x="164" y="188" font-size="24" fill="#172b42" text-anchor="middle">b</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Каждая точка — одна упорядоченная пара. Всего 3 · 2 = 6 пар.</text>
</g>
</svg>
