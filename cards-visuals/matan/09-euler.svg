<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Формула Эйлера на единичной окружности</title>
<desc id="desc">Точка единичной окружности под углом φ имеет координаты cos φ и sin φ; её радиус равен 1.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Формула Эйлера на единичной окружности</text>
<line x1="280" y1="413" x2="280" y2="89" stroke="#e7edf3" stroke-width="1"/><line x1="520" y1="413" x2="520" y2="89" stroke="#e7edf3" stroke-width="1"/><line x1="760" y1="413" x2="760" y2="89" stroke="#e7edf3" stroke-width="1"/><line x1="124" y1="365" x2="772" y2="365" stroke="#e7edf3" stroke-width="1"/><line x1="124" y1="125" x2="772" y2="125" stroke="#e7edf3" stroke-width="1"/><line x1="124" y1="365" x2="772" y2="365" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="280" y1="413" x2="280" y2="89" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><text x="784" y="372" font-size="22" fill="#172b42" text-anchor="start">Re z</text><text x="294" y="79" font-size="22" fill="#172b42" text-anchor="start">Im z</text><text x="263" y="392" font-size="21" fill="#172b42" text-anchor="middle">0</text><path d="M 520 365 A 240 240 0 0 0 280 125" fill="none" stroke="#b4c9df" stroke-width="3"/><line x1="280" y1="365" x2="449.7056274847714" y2="195.29437251522862" stroke="#1264a3" stroke-width="4"/><circle cx="449.7056274847714" cy="195.29437251522862" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><line x1="449.7056274847714" y1="195.29437251522862" x2="449.7056274847714" y2="365" stroke="#52647a" stroke-width="2" stroke-dasharray="8 6"/><line x1="449.7056274847714" y1="195.29437251522862" x2="280" y2="195.29437251522862" stroke="#52647a" stroke-width="2" stroke-dasharray="8 6"/><path d="M 335.2 365 A 55.2 55.2 0 0 0 319.03229432149743 325.96770567850257" fill="none" stroke="#ba3434" stroke-width="2.5"/><text x="356.8" y="338.6" font-size="27" fill="#ba3434" text-anchor="middle">φ</text><text x="474.7056274847714" y="180.29437251522862" font-size="24" fill="#1264a3" text-anchor="start">eⁱᵠ = cos φ + i sin φ</text><text x="449.7056274847714" y="403" font-size="25" fill="#172b42" text-anchor="middle">cos φ</text><text x="260" y="203.29437251522862" font-size="25" fill="#172b42" text-anchor="end">sin φ</text><text x="329.8528137423857" y="262.1471862576143" font-size="28" fill="#1264a3" text-anchor="middle">1</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">На единичной окружности: Re z = cos φ, Im z = sin φ.</text>
</g>
</svg>
