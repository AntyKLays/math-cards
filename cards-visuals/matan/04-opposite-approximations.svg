<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Смена знака меняет границы местами</title>
<desc id="desc">После отражения на числовой прямой верхнее приближение становится нижним и наоборот.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Смена знака меняет границы местами</text>
<text x="450" y="100" font-size="26" fill="#172b42" text-anchor="middle">x = 1,414213…;   −x = −1,414213…</text><line x1="120" y1="200" x2="780" y2="200" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="120" y1="360" x2="780" y2="360" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><circle cx="280" cy="200" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="415" cy="200" r="6" fill="#ba3434" stroke="#ba3434" stroke-width="2.5"/><circle cx="600" cy="200" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="280" y="166" font-size="24" fill="#172b42" text-anchor="middle">x₂ = 1,41</text><text x="600" y="166" font-size="24" fill="#172b42" text-anchor="middle">x̄₂ = 1,42</text><text x="415" y="240" font-size="26" fill="#ba3434" text-anchor="middle">x</text><circle cx="280" cy="360" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="465" cy="360" r="6" fill="#ba3434" stroke="#ba3434" stroke-width="2.5"/><circle cx="600" cy="360" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="280" y="325" font-size="24" fill="#172b42" text-anchor="middle">−x̄₂ = −1,42</text><text x="600" y="325" font-size="24" fill="#172b42" text-anchor="middle">−x₂ = −1,41</text><text x="465" y="405" font-size="26" fill="#ba3434" text-anchor="middle">−x</text><text x="450" y="478" font-size="23" fill="#52647a" text-anchor="middle">При смене знака порядок меняется:</text><text x="450" y="513" font-size="23" fill="#52647a" text-anchor="middle">(−x)₂ = −x̄₂,   (−x)̄₂ = −x₂.</text>
</g>
</svg>
