<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Изолированная точка</title>
<desc id="desc">В окрестности изолированной точки x нет других элементов множества A.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Изолированная точка</text>
<line x1="85" y1="290" x2="815" y2="290" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="335" y1="290" x2="565" y2="290" stroke="#b4c9df" stroke-width="10"/><circle cx="335" cy="290" r="9" fill="#fff" stroke="#1264a3" stroke-width="2.5"/><circle cx="565" cy="290" r="9" fill="#fff" stroke="#1264a3" stroke-width="2.5"/><circle cx="150" cy="290" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="225" cy="290" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="450" cy="290" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="665" cy="290" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="745" cy="290" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="450" y="350" font-size="28" fill="#1264a3" text-anchor="middle">x ∈ A</text><text x="450" y="170" font-size="29" fill="#172b42" text-anchor="middle">Здесь нет других точек A</text><text x="335" y="395" font-size="25" fill="#172b42" text-anchor="middle">x − ε</text><text x="565" y="395" font-size="25" fill="#172b42" text-anchor="middle">x + ε</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Существует окрестность, в которой x — единственная точка A.</text>
</g>
</svg>
