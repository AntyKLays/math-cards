<text x="90" y="196" font-size="22" fill="#52647a" text-anchor="start">Номер</text><text x="90" y="330" font-size="22" fill="#52647a" text-anchor="start">Элемент</text><text x="270" y="196" font-size="26" fill="#1264a3" text-anchor="middle">1</text><line x1="270" y1="215" x2="270" y2="285" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="270" y="330" font-size="26" fill="#172b42" text-anchor="middle">a₁</text><text x="370" y="196" font-size="26" fill="#1264a3" text-anchor="middle">2</text><line x1="370" y1="215" x2="370" y2="285" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="370" y="330" font-size="26" fill="#172b42" text-anchor="middle">a₂</text><text x="470" y="196" font-size="26" fill="#1264a3" text-anchor="middle">3</text><line x1="470" y1="215" x2="470" y2="285" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="470" y="330" font-size="26" fill="#172b42" text-anchor="middle">a₃</text><text x="570" y="196" font-size="26" fill="#1264a3" text-anchor="middle">4</text><line x1="570" y1="215" x2="570" y2="285" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="570" y="330" font-size="26" fill="#172b42" text-anchor="middle">a₄</text><text x="670" y="196" font-size="26" fill="#1264a3" text-anchor="middle">5</text><line x1="670" y1="215" x2="670" y2="285" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="670" y="330" font-size="26" fill="#172b42" text-anchor="middle">a₅</text><text x="770" y="196" font-size="26" fill="#1264a3" text-anchor="middle">…</text><line x1="770" y1="215" x2="770" y2="285" stroke="#1264a3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="770" y="330" font-size="26" fill="#172b42" text-anchor="middle">…</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Каждый элемент имеет свой номер; ни один элемент не пропущен.</text>
