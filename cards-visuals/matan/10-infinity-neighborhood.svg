<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Окрестность бесконечности</title>
<desc id="desc">Закрашенная область задаётся условием Uδ(∞) = {∞} ∪ {z : |z| &gt; δ}; пунктирные границы исключены.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Окрестность бесконечности</text>
<rect x="115" y="121" width="675" height="315" fill="#dcecf9" stroke="none"/><circle cx="340" cy="310" r="110" fill="#fff" stroke="#1264a3" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="160" y1="436" x2="160" y2="121" stroke="#e7edf3" stroke-width="1"/><line x1="250" y1="436" x2="250" y2="121" stroke="#e7edf3" stroke-width="1"/><line x1="340" y1="436" x2="340" y2="121" stroke="#e7edf3" stroke-width="1"/><line x1="430" y1="436" x2="430" y2="121" stroke="#e7edf3" stroke-width="1"/><line x1="520" y1="436" x2="520" y2="121" stroke="#e7edf3" stroke-width="1"/><line x1="610" y1="436" x2="610" y2="121" stroke="#e7edf3" stroke-width="1"/><line x1="700" y1="436" x2="700" y2="121" stroke="#e7edf3" stroke-width="1"/><line x1="790" y1="436" x2="790" y2="121" stroke="#e7edf3" stroke-width="1"/><line x1="115" y1="400" x2="790" y2="400" stroke="#e7edf3" stroke-width="1"/><line x1="115" y1="310" x2="790" y2="310" stroke="#e7edf3" stroke-width="1"/><line x1="115" y1="220" x2="790" y2="220" stroke="#e7edf3" stroke-width="1"/><line x1="115" y1="130" x2="790" y2="130" stroke="#e7edf3" stroke-width="1"/><line x1="115" y1="310" x2="790" y2="310" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="340" y1="436" x2="340" y2="121" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><text x="802" y="317" font-size="22" fill="#172b42" text-anchor="start">Re z</text><text x="354" y="111" font-size="22" fill="#172b42" text-anchor="start">Im z</text><text x="323" y="337" font-size="21" fill="#172b42" text-anchor="middle">0</text><line x1="340" y1="310" x2="450" y2="310" stroke="#1264a3" stroke-width="3"/><text x="403" y="292" font-size="25" fill="#172b42" text-anchor="middle">δ</text><text x="610" y="175" font-size="27" fill="#1264a3" text-anchor="middle">|z| &gt; δ</text><text x="450" y="78" font-size="27" fill="#1264a3" text-anchor="middle">Uδ(∞) = {∞} ∪ {z : |z| &gt; δ}</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Закрашена внешняя область; к ней добавляется точка ∞.</text>
</g>
</svg>
