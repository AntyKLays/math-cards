<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Как приближения доказывают x &gt; y</title>
<desc id="desc">Отрезок приближений y целиком левее отрезка приближений x.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Как приближения доказывают x &gt; y</text>
<line x1="85" y1="285" x2="815" y2="285" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="170" y1="285" x2="320" y2="285" stroke="#1264a3" stroke-width="9"/><circle cx="170" cy="285" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="320" cy="285" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><line x1="550" y1="285" x2="700" y2="285" stroke="#18734b" stroke-width="9"/><circle cx="550" cy="285" r="8" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><circle cx="700" cy="285" r="8" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><text x="245" y="205" font-size="27" fill="#1264a3" text-anchor="middle">y ∈ [yₘ, ȳₘ]</text><text x="625" y="205" font-size="27" fill="#18734b" text-anchor="middle">x ∈ [xₘ, x̄ₘ]</text><text x="320" y="335" font-size="26" fill="#1264a3" text-anchor="middle">ȳₘ</text><text x="550" y="335" font-size="26" fill="#18734b" text-anchor="middle">xₘ</text><line x1="335" y1="285" x2="530" y2="285" stroke="#ba3434" stroke-width="4"/><text x="435" y="405" font-size="29" fill="#ba3434" text-anchor="middle">ȳₘ &lt; xₘ   ⇒   y &lt; x</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Достаточно найти приближения, между которыми есть зазор.</text>
</g>
</svg>
