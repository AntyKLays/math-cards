"middle">Y2</text><circle cx="387.72727272727275" cy="177.01042978553517" r="5" fill="#a9b5c2" stroke="#a9b5c2" stroke-width="2.5"/><circle cx="442.27272727272725" cy="284.8723230839202" r="5" fill="#a9b5c2" stroke="#a9b5c2" stroke-width="2.5"/><circle cx="496.8181818181818" cy="338.9940327416997" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="496.8181818181818" y="316.9940327416997" font-size="24" fill="#1264a3" text-anchor="middle">Y3</text><circle cx="551.3636363636364" cy="249.52996416213293" r="5" fill="#a9b5c2" stroke="#a9b5c2" stroke-width="2.5"/><circle cx="605.909090909091" cy="164.99635024695314" r="5" fill="#a9b5c2" stroke="#a9b5c2" stroke-width="2.5"/><circle cx="660.4545454545455" cy="225.72454515412946" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="660.4545454545455" y="203.72454515412946" font-size="24" fill="#1264a3" text-anchor="middle">Y4</text><circle cx="715" cy="330.90175463303274" r="5" fill="#a9b5c2" stroke="#a9b5c2" stroke-width="2.5"/><text x="450" y="87" font-size="23" fill="#172b42" text-anchor="middle">Выбраны номера k₁ = 2, k₂ = 5, k₃ = 8, k₄ = 11, …</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Подпоследовательность берёт члены в исходном порядке: Yₙ = Xₖₙ.</text>
