<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">ε-окрестность на прямой</title>
<desc id="desc">Открытый интервал вокруг a: оба конца на расстоянии ε от a и не входят в окрестность.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">ε-окрестность на прямой</text>
<text x="450" y="110" font-size="32" fill="#172b42" text-anchor="middle">|x − a| &lt; ε</text><line x1="85" y1="290" x2="815" y2="290" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="220" y1="290" x2="680" y2="290" stroke="#1264a3" stroke-width="10"/><circle cx="220" cy="290" r="10" fill="#fff" stroke="#1264a3" stroke-width="2.5"/><circle cx="680" cy="290" r="10" fill="#fff" stroke="#1264a3" stroke-width="2.5"/><circle cx="450" cy="290" r="6" fill="#172b42" stroke="#172b42" stroke-width="2.5"/><text x="220" y="345" font-size="27" fill="#172b42" text-anchor="middle">a − ε</text><text x="450" y="345" font-size="27" fill="#172b42" text-anchor="middle">a</text><text x="680" y="345" font-size="27" fill="#172b42" text-anchor="middle">a + ε</text><line x1="220" y1="210" x2="450" y2="210" stroke="#1264a3" stroke-width="2"/><line x1="450" y1="210" x2="680" y2="210" stroke="#1264a3" stroke-width="2"/><text x="335" y="192" font-size="26" fill="#1264a3" text-anchor="middle">ε</text><text x="565" y="192" font-size="26" fill="#1264a3" text-anchor="middle">ε</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Концы исключены: это открытый интервал (a − ε; a + ε).</text>
</g>
</svg>
