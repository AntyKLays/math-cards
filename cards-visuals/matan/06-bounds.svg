<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Верхняя и нижняя оценки</title>
<desc id="desc">Все элементы A лежат на числовой прямой между нижней оценкой m и верхней оценкой M.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Верхняя и нижняя оценки</text>
<rect x="185" y="205" width="530" height="120" fill="#eef5fb" stroke="none"/><line x1="85" y1="285" x2="815" y2="285" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="185" y1="278" x2="185" y2="292" stroke="#18734b" stroke-width="2"/><text x="185" y="322" font-size="23" fill="#18734b" text-anchor="middle">m</text><line x1="715" y1="278" x2="715" y2="292" stroke="#18734b" stroke-width="2"/><text x="715" y="322" font-size="23" fill="#18734b" text-anchor="middle">M</text><circle cx="260" cy="285" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="335" cy="285" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="410" cy="285" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="520" cy="285" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="580" cy="285" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="630" cy="285" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="450" y="170" font-size="27" fill="#1264a3" text-anchor="middle">Множество A</text><text x="450" y="400" font-size="29" fill="#172b42" text-anchor="middle">m ≤ a ≤ M  для каждого a ∈ A</text><text x="450" y="492" font-size="23" fill="#52647a" text-anchor="middle">Ни один элемент A не выходит за выбранные границы m и M.</text>
</g>
</svg>
