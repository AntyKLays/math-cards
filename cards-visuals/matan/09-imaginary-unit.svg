<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Умножение на i — четверть оборота</title>
<desc id="desc">Точки 1,i,−1,−i на единичной окружности; умножение на i поворачивает на 90° против часовой стрелки.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Умножение на i — четверть оборота</text>
<line x1="180" y1="423.5" x2="180" y2="113" stroke="#e7edf3" stroke-width="1"/><line x1="315" y1="423.5" x2="315" y2="113" stroke="#e7edf3" stroke-width="1"/><line x1="450" y1="423.5" x2="450" y2="113" stroke="#e7edf3" stroke-width="1"/><line x1="585" y1="423.5" x2="585" y2="113" stroke="#e7edf3" stroke-width="1"/><line x1="720" y1="423.5" x2="720" y2="113" stroke="#e7edf3" stroke-width="1"/><line x1="180" y1="410" x2="720" y2="410" stroke="#e7edf3" stroke-width="1"/><line x1="180" y1="275" x2="720" y2="275" stroke="#e7edf3" stroke-width="1"/><line x1="180" y1="140" x2="720" y2="140" stroke="#e7edf3" stroke-width="1"/><line x1="180" y1="275" x2="720" y2="275" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="450" y1="423.5" x2="450" y2="113" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><text x="732" y="282" font-size="22" fill="#172b42" text-anchor="start">Re z</text><text x="464" y="103" font-size="22" fill="#172b42" text-anchor="start">Im z</text><text x="433" y="302" font-size="21" fill="#172b42" text-anchor="middle">0</text><circle cx="450" cy="275" r="135" fill="none" stroke="#b4c9df" stroke-width="2.5"/><circle cx="585" cy="275" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="585" y="313" font-size="28" fill="#1264a3" text-anchor="middle">1</text><circle cx="450" cy="140" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="422" y="130" font-size="28" fill="#1264a3" text-anchor="middle">i</text><circle cx="315" cy="275" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="315" y="313" font-size="28" fill="#1264a3" text-anchor="middle">−1</text><circle cx="450" cy="410" r="6" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><text x="485" y="418" font-size="28" fill="#1264a3" text-anchor="middle">−i</text><path d="M 585 275 A 135 135 0 0 0 450 140" fill="none" stroke="#ba3434" stroke-width="4" marker-end="url(#arrow-red)"/><text x="630" y="165" font-size="25" fill="#ba3434" text-anchor="middle">× i: +90°</text><text x="450" y="478" font-size="23" fill="#52647a" text-anchor="middle">1 → i → −1 → −i → 1</text><text x="450" y="513" font-size="23" fill="#52647a" text-anchor="middle">Каждое умножение на i — поворот на 90° против часовой стрелки.</text>
</g>
</svg>
