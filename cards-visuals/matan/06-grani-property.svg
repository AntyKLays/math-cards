<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Два упорядоченных множества</title>
<desc id="desc">A находится целиком левее B; между sup A и inf B нет элементов A или B.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172b42"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1264a3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ba3434"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#18734b"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="450" y="43" font-size="28" fill="#172b42" text-anchor="middle">Два упорядоченных множества</text>
<line x1="85" y1="290" x2="815" y2="290" stroke="#172b42" stroke-width="2" marker-end="url(#arrow-ink)"/><line x1="160" y1="290" x2="380" y2="290" stroke="#1264a3" stroke-width="9"/><circle cx="160" cy="290" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><circle cx="380" cy="290" r="8" fill="#1264a3" stroke="#1264a3" stroke-width="2.5"/><line x1="530" y1="290" x2="740" y2="290" stroke="#18734b" stroke-width="9"/><circle cx="530" cy="290" r="8" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><circle cx="740" cy="290" r="8" fill="#18734b" stroke="#18734b" stroke-width="2.5"/><text x="270" y="225" font-size="32" fill="#1264a3" text-anchor="middle">A</text><text x="635" y="225" font-size="32" fill="#18734b" text-anchor="middle">B</text><text x="380" y="345" font-size="26" fill="#1264a3" text-anchor="middle">sup A</text><text x="530" y="345" font-size="26" fill="#18734b" text-anchor="middle">inf B</text><text x="450" y="405" font-size="30" fill="#172b42" text-anchor="middle">sup A ≤ inf B</text><text x="450" y="478" font-size="23" fill="#52647a" text-anchor="middle">Если каждый элемент A не больше каждого элемента B,</text><text x="450" y="513" font-size="23" fill="#52647a" text-anchor="middle">то верхняя грань A не больше нижней грани B.</text>
</g>
</svg>
